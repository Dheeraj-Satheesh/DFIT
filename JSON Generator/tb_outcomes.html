<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TB Outcomes Excel to JSON Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            padding: 30px 16px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #183153;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .upload-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #fafafa;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .convert-btn {
            width: 100%;
            background: #1769aa;
            color: white;
        }

        .convert-btn:hover {
            background: #10548b;
        }

        .copy-all-btn {
            background: #16804a;
            color: white;
        }

        .copy-btn {
            background: #183153;
            color: white;
            padding: 8px 13px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .output-header h2 {
            color: #183153;
        }

        .sheet-card {
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .sheet-header {
            padding: 15px 18px;
            background: #eaf1f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .sheet-header h3 {
            color: #183153;
            font-size: 16px;
        }

        pre {
            padding: 18px;
            overflow-x: auto;
            max-height: 450px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre;
            background: white;
        }

        .message {
            padding: 13px;
            border-radius: 7px;
            margin-bottom: 18px;
            display: none;
            line-height: 1.5;
        }

        .error {
            background: #ffe8e8;
            color: #a40000;
        }

        .success {
            background: #e5f7ec;
            color: #126b37;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .upload-section {
                padding: 17px;
            }

            .sheet-header {
                align-items: flex-start;
            }

            pre {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>TB Outcomes Excel to JSON Converter</h1>

        <p class="subtitle">
            Convert all Excel worksheets into JSON using your existing template.
        </p>

        <div class="upload-section">

            <div class="upload-group">
                <label for="excelFile">Upload Excel Workbook</label>
                <input type="file" id="excelFile" accept=".xlsx,.xls">
            </div>

            <div class="upload-group">
                <label for="jsonFile">Upload JSON Template</label>
                <input type="file" id="jsonFile" accept=".json">
            </div>

            <button class="convert-btn" id="convertBtn" onclick="convertFiles()">
                Convert Excel to JSON
            </button>

        </div>

        <div id="message" class="message"></div>

        <div id="outputSection" class="hidden">

            <div class="output-header">
                <h2>Generated JSON</h2>

                <button class="copy-all-btn" onclick="copyAll()">
                    📋 Copy All JSON
                </button>
            </div>

            <div id="output"></div>

        </div>

    </div>

    <script>
        let generatedResults = {};

        const EXCEL_START_ROW = 3;
        const EXPECTED_RECORDS = 32;

        const EXCEL_COLUMNS = {
            quarter1: "D",
            quarter2: "E",
            quarter3: "F",
            quarter4: "G",
            total: "H",
            percentage: "I"
        };

        const JSON_KEYS = {
            quarter1: "I Qtr-2026",
            quarter2: "II Qtr-2026",
            quarter3: "III Qtr-2026",
            quarter4: "IV Qtr-2026",
            total: "Total 2026",
            percentage: "%"
        };

        function showMessage(message, type) {
            const element = document.getElementById("message");

            element.textContent = message;
            element.className = "message " + type;
            element.style.display = "block";
        }

        function getCellValue(sheet, column, rowNumber) {
            const address = column + rowNumber;
            const cell = sheet[address];

            if (!cell || cell.v === null || cell.v === undefined) {
                return "";
            }

            if (cell.t === "e") {
                throw new Error(
                    `Excel error in cell ${address}: ${cell.w || cell.v}`
                );
            }

            if (cell.w !== undefined && cell.w !== null) {
                return String(cell.w);
            }

            return String(cell.v);
        }

        function validateTemplate(template) {
            if (!Array.isArray(template)) {
                throw new Error("JSON template must be an array.");
            }

            if (template.length !== EXPECTED_RECORDS) {
                throw new Error(
                    `Expected ${EXPECTED_RECORDS} JSON objects, found ${template.length}.`
                );
            }

            const requiredKeys = Object.values(JSON_KEYS);

            template.forEach((item, index) => {
                requiredKeys.forEach(key => {
                    if (!Object.prototype.hasOwnProperty.call(item, key)) {
                        throw new Error(
                            `Missing key "${key}" in JSON object ${index + 1}.`
                        );
                    }
                });
            });
        }

        function validateExcelSheet(sheet, sheetName) {
            const expectedHeaders = {
                B2: "Type of cases",
                D2: "I qtr-2026",
                E2: "II qtr -2026",
                F2: "III qtr-2026",
                G2: "IV qtr- 2026",
                H2: "Total 2026",
                I2: "%"
            };

            for (const [address, expected] of Object.entries(expectedHeaders)) {
                const cell = sheet[address];

                const actual = String(cell?.v ?? "")
                    .trim()
                    .replace(/\s+/g, " ");

                if (
                    actual.toLowerCase() !== expected.toLowerCase()
                ) {
                    throw new Error(
                        `Incorrect Excel header in "${sheetName}" at ${address}. ` +
                        `Expected "${expected}", found "${actual}".`
                    );
                }
            }

            for (
                let row = EXCEL_START_ROW;
                row < EXCEL_START_ROW + EXPECTED_RECORDS;
                row++
            ) {
                const description = sheet["B" + row];

                if (
                    !description ||
                    description.v === null ||
                    String(description.v).trim() === ""
                ) {
                    throw new Error(
                        `Missing metric description in "${sheetName}", cell B${row}.`
                    );
                }
            }
        }

        function convertSheet(sheet, sheetName, template) {
            validateExcelSheet(sheet, sheetName);

            const result = template.map((templateObject, index) => {
                const excelRow = EXCEL_START_ROW + index;

                const updatedObject = { ...templateObject };

                updatedObject[JSON_KEYS.quarter1] =
                    getCellValue(sheet, EXCEL_COLUMNS.quarter1, excelRow);

                updatedObject[JSON_KEYS.quarter2] =
                    getCellValue(sheet, EXCEL_COLUMNS.quarter2, excelRow);

                updatedObject[JSON_KEYS.quarter3] =
                    getCellValue(sheet, EXCEL_COLUMNS.quarter3, excelRow);

                updatedObject[JSON_KEYS.quarter4] =
                    getCellValue(sheet, EXCEL_COLUMNS.quarter4, excelRow);

                updatedObject[JSON_KEYS.total] =
                    getCellValue(sheet, EXCEL_COLUMNS.total, excelRow);

                updatedObject[JSON_KEYS.percentage] =
                    getCellValue(sheet, EXCEL_COLUMNS.percentage, excelRow);

                return updatedObject;
            });

            return result;
        }

        async function convertFiles() {
            const excelFile = document.getElementById("excelFile").files[0];
            const jsonFile = document.getElementById("jsonFile").files[0];

            const convertButton = document.getElementById("convertBtn");

            generatedResults = {};

            document.getElementById("outputSection").classList.add("hidden");
            document.getElementById("output").innerHTML = "";

            if (!excelFile || !jsonFile) {
                showMessage(
                    "Please upload both Excel workbook and JSON template.",
                    "error"
                );
                return;
            }

            try {
                convertButton.disabled = true;
                convertButton.textContent = "Converting...";

                const [excelBuffer, jsonText] = await Promise.all([
                    excelFile.arrayBuffer(),
                    jsonFile.text()
                ]);

                const workbook = XLSX.read(excelBuffer, {
                    type: "array",
                    cellDates: false,
                    cellNF: true
                });

                const template = JSON.parse(jsonText);

                validateTemplate(template);

                for (const sheetName of workbook.SheetNames) {
                    const sheet = workbook.Sheets[sheetName];

                    generatedResults[sheetName] = convertSheet(
                        sheet,
                        sheetName,
                        template
                    );
                }

                displayResults();

                document.getElementById("outputSection").classList.remove("hidden");

                showMessage(
                    `Successfully converted ${workbook.SheetNames.length} worksheets. ` +
                    `${EXPECTED_RECORDS} records generated per worksheet.`,
                    "success"
                );

            } catch (error) {
                generatedResults = {};

                document.getElementById("outputSection").classList.add("hidden");

                showMessage(error.message, "error");

            } finally {
                convertButton.disabled = false;
                convertButton.textContent = "Convert Excel to JSON";
            }
        }

        function displayResults() {
            const output = document.getElementById("output");

            output.innerHTML = "";

            Object.entries(generatedResults).forEach(
                ([sheetName, jsonData]) => {
                    const card = document.createElement("div");
                    card.className = "sheet-card";

                    const header = document.createElement("div");
                    header.className = "sheet-header";

                    const heading = document.createElement("h3");
                    heading.textContent = sheetName;

                    const copyButton = document.createElement("button");
                    copyButton.className = "copy-btn";
                    copyButton.textContent = "📋 Copy JSON";
                    copyButton.onclick = () => copySheet(sheetName);

                    header.appendChild(heading);
                    header.appendChild(copyButton);

                    const preview = document.createElement("pre");
                    preview.textContent = JSON.stringify(jsonData, null, 2);

                    card.appendChild(header);
                    card.appendChild(preview);

                    output.appendChild(card);
                }
            );
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                showMessage("JSON copied successfully.", "success");

            } catch (error) {
                const textArea = document.createElement("textarea");

                textArea.value = text;
                document.body.appendChild(textArea);

                textArea.select();

                const copied = document.execCommand("copy");

                textArea.remove();

                if (copied) {
                    showMessage("JSON copied successfully.", "success");
                } else {
                    showMessage("Unable to copy JSON.", "error");
                }
            }
        }

        function copySheet(sheetName) {
            copyText(
                JSON.stringify(generatedResults[sheetName], null, 2)
            );
        }

        function copyAll() {
            copyText(
                JSON.stringify(generatedResults, null, 2)
            );
        }
    </script>

</body>

</html>
