<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to JSON Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 35px 20px;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .upload-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }

        .field {
            margin: 20px 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 9px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .convert-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        .convert-btn:hover {
            background: #1d4ed8;
        }

        .convert-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            display: none;
            padding: 13px;
            margin-top: 18px;
            border-radius: 6px;
            white-space: pre-wrap;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        #results {
            display: none;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .copy-all {
            padding: 11px 16px;
            background: #16a34a;
            color: white;
        }

        .sheet-card {
            background: white;
            border-radius: 10px;
            margin-bottom: 22px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            border-bottom: 1px solid #eee;
            gap: 12px;
        }

        .sheet-header h3 {
            margin: 0;
            font-size: 17px;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 13px;
            background: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }

        .copy-btn:hover {
            background: #dbeafe;
        }

        .copy-btn svg {
            width: 16px;
            height: 16px;
        }

        .json-content {
            padding: 18px;
            background: #111827;
            color: #d1fae5;
            overflow: auto;
            max-height: 550px;
            font-family: Consolas, monospace;
            font-size: 13px;
            line-height: 1.7;
            white-space: pre;
            margin: 0;
        }

        .sheet-info {
            padding: 10px 18px;
            color: #666;
            font-size: 13px;
            background: #fafafa;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="upload-card">
            <h2>Excel to JSON Converter</h2>
            <p>Upload your Excel workbook and fixed JSON template.</p>

            <div class="field">
                <label>1. Upload Excel Workbook</label>
                <input type="file" id="excelFile" accept=".xlsx,.xls">
            </div>

            <div class="field">
                <label>2. Upload Fixed JSON Template</label>
                <input type="file" id="jsonFile" accept=".json">
            </div>

            <button class="convert-btn" id="convertBtn" onclick="convertFiles()">
                Convert Excel to JSON
            </button>

            <div id="status"></div>
        </div>

        <div id="results">
            <div class="results-header">
                <h2>Converted JSON Files</h2>
                <button class="copy-all" onclick="copyAll()">
                    Copy All JSON
                </button>
            </div>

            <div id="output"></div>
        </div>

    </div>

    <script>
        let convertedFiles = [];

        function normalize(value) {
            return String(value ?? "")
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]/g, "");
        }

        function normalizeSno(value) {
            return String(value ?? "")
                .trim()
                .replace(/\s+/g, "")
                .toLowerCase();
        }

        function romanToNumber(value) {
            const map = {
                i: 1,
                ii: 2,
                iii: 3,
                iv: 4,
                "1": 1,
                "2": 2,
                "3": 3,
                "4": 4
            };

            return map[value] ?? null;
        }

        function getQuarterIndex(header) {
            const value = normalize(header);

            const match = value.match(
                /^(?:(?:qtr|quarter)(i{1,3}|iv|[1-4])|(i{1,3}|iv|[1-4])(?:qtr|quarter))(?:2026)?$/
            );

            if (match) {
                return romanToNumber(match[1] || match[2]);
            }

            return null;
        }

        function identifyTemplateKeys(template) {
            const first = template[0];
            const quarterKeys = {};

            Object.keys(first).forEach(key => {
                const quarter = getQuarterIndex(key);

                if (quarter) {
                    quarterKeys[quarter] = key;
                }
            });

            const annualKey = Object.keys(first).find(key =>
                normalize(key).startsWith("annual")
            );

            return { quarterKeys, annualKey };
        }

        function identifyExcelColumns(rows) {
            for (let rowIndex = 0; rowIndex < Math.min(rows.length, 20); rowIndex++) {
                const row = rows[rowIndex];

                const columns = {
                    sno: -1,
                    quarters: {},
                    annual: -1
                };

                row.forEach((cell, columnIndex) => {
                    const key = normalize(cell);

                    if (["sno", "serialno", "serialnumber"].includes(key)) {
                        columns.sno = columnIndex;
                    }

                    const quarter = getQuarterIndex(cell);

                    if (quarter) {
                        columns.quarters[quarter] = columnIndex;
                    }

                    if (key.startsWith("annual")) {
                        columns.annual = columnIndex;
                    }
                });

                if (columns.sno !== -1) {
                    return {
                        headerRow: rowIndex,
                        columns
                    };
                }
            }

            throw new Error("S.NO column not found in the first 20 rows.");
        }

        function cellValue(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value).trim();
        }

        function convertSheet(sheet, template, templateKeys) {
            const rows = XLSX.utils.sheet_to_json(sheet, {
                header: 1,
                defval: ""
            });

            const { headerRow, columns } = identifyExcelColumns(rows);
            const excelData = new Map();

            for (let i = headerRow + 1; i < rows.length; i++) {
                const row = rows[i];
                const sno = normalizeSno(row[columns.sno]);

                if (sno) {
                    excelData.set(sno, row);
                }
            }

            const output = [];
            const missing = [];

            template.forEach(templateRow => {
                const sno = normalizeSno(templateRow["S.NO"]);
                const excelRow = excelData.get(sno);
                const newRow = { ...templateRow };

                if (!excelRow) {
                    missing.push(templateRow["S.NO"]);
                    output.push(newRow);
                    return;
                }

                Object.entries(templateKeys.quarterKeys).forEach(([quarter, jsonKey]) => {
                    const excelColumn = columns.quarters[quarter];

                    if (excelColumn !== undefined) {
                        newRow[jsonKey] = cellValue(excelRow[excelColumn]);
                    }
                });

                if (templateKeys.annualKey && columns.annual !== -1) {
                    newRow[templateKeys.annualKey] = cellValue(
                        excelRow[columns.annual]
                    );
                }

                output.push(newRow);
            });

            return { output, missing };
        }

        function copyIcon() {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="8" width="13" height="13" rx="2"></rect>
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
        </svg>`;
        }

        async function copyText(text, button) {
            try {
                await navigator.clipboard.writeText(text);

                const original = button.innerHTML;
                button.innerHTML = "✓ Copied";

                setTimeout(() => {
                    button.innerHTML = original;
                }, 1500);
            } catch (error) {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();

                const copied = document.execCommand("copy");
                textarea.remove();

                if (copied) {
                    const original = button.innerHTML;
                    button.innerHTML = "✓ Copied";

                    setTimeout(() => {
                        button.innerHTML = original;
                    }, 1500);
                } else {
                    alert("Unable to copy. Please select and copy the JSON manually.");
                }
            }
        }

        async function copyAll() {
            const allJson = convertedFiles.map(file =>
                `// ${file.name}\n${file.json}`
            ).join("\n\n");

            await copyText(allJson, document.querySelector(".copy-all"));
        }

        function displayResults() {
            const output = document.getElementById("output");
            output.innerHTML = "";

            convertedFiles.forEach((file, index) => {
                const card = document.createElement("div");
                card.className = "sheet-card";

                const header = document.createElement("div");
                header.className = "sheet-header";

                const title = document.createElement("h3");
                title.textContent = file.name + ".json";

                const button = document.createElement("button");
                button.className = "copy-btn";
                button.innerHTML = copyIcon() + " Copy JSON";
                button.addEventListener("click", () => {
                    copyText(file.json, button);
                });

                header.appendChild(title);
                header.appendChild(button);

                const pre = document.createElement("pre");
                pre.className = "json-content";
                pre.textContent = file.json;

                const info = document.createElement("div");
                info.className = "sheet-info";
                info.textContent = `${file.rows} rows converted` +
                    (file.missing.length
                        ? ` | Unmatched S.NO: ${file.missing.join(", ")}`
                        : " | All S.NO matched");

                card.appendChild(header);
                card.appendChild(pre);
                card.appendChild(info);

                output.appendChild(card);
            });

            document.getElementById("results").style.display = "block";
        }

        async function convertFiles() {
            const excelInput = document.getElementById("excelFile");
            const jsonInput = document.getElementById("jsonFile");
            const button = document.getElementById("convertBtn");
            const status = document.getElementById("status");

            status.style.display = "block";
            status.className = "error";

            if (!excelInput.files.length || !jsonInput.files.length) {
                status.textContent = "Please upload both Excel and JSON files.";
                return;
            }

            button.disabled = true;
            status.className = "";
            status.textContent = "Processing files...";

            try {
                const excelBuffer = await excelInput.files[0].arrayBuffer();
                const jsonText = await jsonInput.files[0].text();

                const workbook = XLSX.read(excelBuffer, {
                    type: "array"
                });

                const template = JSON.parse(jsonText);

                if (!Array.isArray(template) || template.length === 0) {
                    throw new Error("JSON template must be a non-empty array.");
                }

                if (!template.every(row => Object.hasOwn(row, "S.NO"))) {
                    throw new Error('Every template row must contain the "S.NO" key.');
                }

                const templateKeys = identifyTemplateKeys(template);
                convertedFiles = [];

                const reports = [];

                workbook.SheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];

                    const { output, missing } = convertSheet(
                        sheet,
                        template,
                        templateKeys
                    );

                    const json = JSON.stringify(output, null, 4);

                    convertedFiles.push({
                        name: sheetName,
                        json,
                        rows: output.length,
                        missing
                    });

                    reports.push(
                        `${sheetName}: ${output.length} rows converted`
                    );
                });

                displayResults();

                status.className = "success";
                status.textContent =
                    "Conversion completed successfully!\n" +
                    reports.join("\n");

            } catch (error) {
                status.className = "error";
                status.textContent = "Error: " + error.message;
                document.getElementById("results").style.display = "none";
            } finally {
                button.disabled = false;
            }
        }
    </script>

</body>

</html>
